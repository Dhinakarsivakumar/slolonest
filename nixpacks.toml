[providers]
providers = ["python"]

[phases.install]
cmds = ["python -m pip install --upgrade pip", "python -m pip install -r requirements.txt"]

[phases.build]
cmds = ["python manage.py collectstatic --noinput"]

[start]
cmd = "python manage.py migrate --noinput && gunicorn soloNest.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
