services:
  - type: web
    name: slolonest
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn soloNest.wsgi:application --log-file -
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: slolonest-db
          property: connectionString
      - key: RAZORPAY_KEY_ID
        value: ""
      - key: RAZORPAY_KEY_SECRET
        value: ""
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.console.EmailBackend"
      - key: DEFAULT_FROM_EMAIL
        value: "SoloNest <noreply@slolonest.onrender.com>"
      - key: OTP_DEV_MODE
        value: "True"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://slolonest.onrender.com"

databases:
  - name: slolonest-db
    databaseName: slolonest
    plan: free

