name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'solonest_mobile/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create full Flutter project structure
        working-directory: solonest_mobile
        run: |
          # Save our custom Dart source files and pubspec
          cp -r lib lib_backup
          cp pubspec.yaml pubspec_backup.yaml

          # Generate a complete Flutter project (including android/ folder)
          flutter create --org com.solonest --project-name solonest_mobile --platforms android .

          # Restore our custom source files and dependencies
          rm -rf lib
          mv lib_backup lib
          mv pubspec_backup.yaml pubspec.yaml

          # Add Internet permissions before <application in AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's|<application|    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <application|' "$MANIFEST"
          fi

          # Ensure minSdk is at least 21 in build.gradle / build.gradle.kts
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = .*/minSdk = 21/g' android/app/build.gradle.kts
          fi

      - name: Install dependencies
        working-directory: solonest_mobile
        run: flutter pub get

      - name: Build Android APK
        working-directory: solonest_mobile
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee build.log || {
            echo "=== BUILD ERROR LOG ==="
            tail -n 120 build.log
            exit 1
          }
          find build/ -name "*.apk"

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: solonest_mobile/build.log

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SoloNest-Android-APK
          path: solonest_mobile/build/**/*.apk
