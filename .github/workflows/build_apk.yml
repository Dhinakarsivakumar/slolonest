name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'solonest_mobile/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create full Flutter project structure
        working-directory: solonest_mobile
        run: |
          # Save our custom Dart source files
          cp -r lib lib_backup

          # Generate a complete Flutter project (including android/ folder)
          flutter create --org com.solonest --project-name solonest_mobile --platforms android .

          # Restore our custom source files over the generated ones
          rm -rf lib
          mv lib_backup lib

      - name: Install dependencies
        working-directory: solonest_mobile
        run: flutter pub get

      - name: Build Android APK
        working-directory: solonest_mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoloNest-Android-APK
          path: solonest_mobile/build/app/outputs/flutter-apk/app-release.apk
