name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'solonest_mobile/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create full Flutter project structure
        working-directory: solonest_mobile
        run: |
          # Save our custom Dart source files and pubspec
          cp -r lib lib_backup
          cp pubspec.yaml pubspec_backup.yaml

          # Generate a complete Flutter project (including android/ folder)
          flutter create --org com.solonest --project-name solonest_mobile --platforms android .

          # Restore our custom source files and dependencies
          rm -rf lib
          mv lib_backup lib
          mv pubspec_backup.yaml pubspec.yaml

          # Add Internet permissions cleanly before </manifest> in AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's|</manifest>|    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n</manifest>|' "$MANIFEST"
          fi

          # Ensure minSdk is at least 21
          echo "flutter.minSdkVersion=21" >> android/local.properties
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          fi

      - name: Install dependencies
        working-directory: solonest_mobile
        run: flutter pub get

      - name: Build Android APK
        working-directory: solonest_mobile
        run: |
          flutter build apk --release --no-tree-shake-icons
          find build/ -name "*.apk"

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SoloNest-Android-APK
          path: solonest_mobile/build/**/*.apk
